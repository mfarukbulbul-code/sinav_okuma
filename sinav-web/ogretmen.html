<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Öğretmen Paneli - Sınav Değerlendirme</title>
<link rel="stylesheet" href="stil.css">
</head>
<body>
<div class="kapsayici">
  <h1>Sınav Değerlendirme Sistemi</h1>
  <p class="aciklama">Öğretmen paneli</p>

  <!-- DERS EKLEME / SEÇME -->
  <div class="kart">
    <h2>1. Ders</h2>
    <label for="dersSecimi">Mevcut ders</label>
    <select id="dersSecimi"></select>

    <label for="yeniDersAdi">Yeni ders ekle</label>
    <input type="text" id="yeniDersAdi" placeholder="Örn: 8. Sınıf Matematik">
    <button onclick="dersEkle()">Ders Ekle</button>
    <div id="dersMesaj"></div>
  </div>

  <!-- SINAV OLUŞTURMA -->
  <div class="kart">
    <h2>2. Yeni Sınav Oluştur (Cevap Anahtarı)</h2>
    <label for="sinavAdi">Sınav adı</label>
    <input type="text" id="sinavAdi" placeholder="Örn: 1. Dönem 2. Yazılı">

    <label for="cevapAnahtariFotolari">Cevap anahtarı fotoğrafları (birden fazla sayfa seçebilirsin)</label>
    <input type="file" id="cevapAnahtariFotolari" accept="image/*" multiple capture="environment">

    <button onclick="sinavOlustur()" id="sinavOlusturBtn">Cevap Anahtarını Oku ve Sınavı Oluştur</button>
    <div id="sinavMesaj"></div>

    <div id="linkAlani" style="display:none; margin-top:14px;">
      <label>Öğrencilere paylaşacağın link:</label>
      <div class="link-kutusu" id="sinavLinki"></div>
      <button class="ikincil" onclick="whatsappPaylas()">WhatsApp'tan Paylaş</button>
    </div>
  </div>

  <!-- SINAV SONUÇLARI -->
  <div class="kart">
    <h2>3. Seçili Dersin Sonuçları</h2>
    <button onclick="sonuclariGetir()">Sonuçları Yenile</button>
    <div id="sonuclarAlani"></div>
  </div>

  <!-- GENEL ORTALAMA -->
  <div class="kart">
    <h2>4. Tüm Öğrencilerin Genel Ortalaması</h2>
    <button onclick="genelOrtalamaGetir()">Genel Ortalamayı Getir</button>
    <div id="genelOrtalamaAlani"></div>
  </div>
</div>

<script src="ayarlar.js"></script>
<script>
let dersler = [];
let sonSinavLinki = "";

async function api(fonksiyon, govde) {
  const yanit = await fetch(FONKSIYON_URL(fonksiyon), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(govde),
  });
  return await yanit.json();
}

async function dersleriYukle() {
  const sonuc = await api("admin-api", { action: "ders_listele" });
  dersler = sonuc.dersler || [];
  const secim = document.getElementById("dersSecimi");
  secim.innerHTML = dersler.map(d => `<option value="${d.id}">${d.ders_adi}</option>`).join("");
}

async function dersEkle() {
  const ad = document.getElementById("yeniDersAdi").value.trim();
  if (!ad) return;
  const sonuc = await api("admin-api", { action: "ders_ekle", ders_adi: ad });
  const mesajAlani = document.getElementById("dersMesaj");
  if (sonuc.basarili) {
    mesajAlani.innerHTML = `<div class="mesaj basarili">Ders eklendi.</div>`;
    document.getElementById("yeniDersAdi").value = "";
    await dersleriYukle();
  } else {
    mesajAlani.innerHTML = `<div class="mesaj hata">${sonuc.hata}</div>`;
  }
}

async function sinavOlustur() {
  const dersId = document.getElementById("dersSecimi").value;
  const sinavAdi = document.getElementById("sinavAdi").value.trim();
  const dosyalar = document.getElementById("cevapAnahtariFotolari").files;
  const btn = document.getElementById("sinavOlusturBtn");
  const mesajAlani = document.getElementById("sinavMesaj");

  if (!dersId) { mesajAlani.innerHTML = `<div class="mesaj hata">Önce bir ders seç.</div>`; return; }
  if (!sinavAdi) { mesajAlani.innerHTML = `<div class="mesaj hata">Sınav adı gir.</div>`; return; }
  if (dosyalar.length === 0) { mesajAlani.innerHTML = `<div class="mesaj hata">En az bir fotoğraf seç.</div>`; return; }

  btn.disabled = true;
  mesajAlani.innerHTML = `<div class="mesaj basarili">Cevap anahtarı okunuyor, biraz sürebilir...</div>`;

  try {
    const gorseller = await birdenFazlaDosyayiBase64eCevir(Array.from(dosyalar));
    const sonuc = await api("cevap-anahtari-oku", { ders_id: dersId, sinav_adi: sinavAdi, gorseller });

    if (sonuc.basarili) {
      mesajAlani.innerHTML = `<div class="mesaj basarili">Sınav oluşturuldu!</div>`;
      sonSinavLinki = `${window.location.origin}${window.location.pathname.replace('ogretmen.html','')}sinav.html?kod=${sonuc.sinav.link_kodu}`;
      document.getElementById("sinavLinki").textContent = sonSinavLinki;
      document.getElementById("linkAlani").style.display = "block";
    } else {
      mesajAlani.innerHTML = `<div class="mesaj hata">${sonuc.hata}</div>`;
    }
  } catch (e) {
    mesajAlani.innerHTML = `<div class="mesaj hata">Hata: ${e}</div>`;
  } finally {
    btn.disabled = false;
  }
}

function whatsappPaylas() {
  const metin = encodeURIComponent(`Sınav linki: ${sonSinavLinki}`);
  window.open(`https://wa.me/?text=${metin}`, "_blank");
}

async function sonuclariGetir() {
  const dersId = document.getElementById("dersSecimi").value;
  if (!dersId) return;
  const sonuc = await api("admin-api", { action: "sonuclar_getir", ders_id: dersId });
  const alan = document.getElementById("sonuclarAlani");

  if (!sonuc.basarili) { alan.innerHTML = `<div class="mesaj hata">${sonuc.hata}</div>`; return; }

  let html = `<h3 style="font-size:14px;margin-top:16px;">Ders ortalamaları</h3>`;
  html += `<table><tr><th>Öğrenci</th><th>Ortalama</th></tr>`;
  for (const o of sonuc.ders_ortalamalari) {
    html += `<tr><td>${o.ad_soyad}</td><td>${o.ortalama}</td></tr>`;
  }
  html += `</table>`;

  html += `<h3 style="font-size:14px;margin-top:16px;">Tüm sonuçlar</h3>`;
  html += `<table><tr><th>Öğrenci</th><th>Sınav</th><th>Puan</th></tr>`;
  for (const s of sonuc.sonuclar) {
    html += `<tr><td>${s.ogrenciler?.ad_soyad ?? "-"}</td><td>${s.sinavlar?.sinav_adi ?? "-"}</td><td>${s.puan}</td></tr>`;
  }
  html += `</table>`;

  alan.innerHTML = html;
}

async function genelOrtalamaGetir() {
  const sonuc = await api("admin-api", { action: "genel_ortalama_getir" });
  const alan = document.getElementById("genelOrtalamaAlani");
  if (!sonuc.basarili) { alan.innerHTML = `<div class="mesaj hata">${sonuc.hata}</div>`; return; }

  let html = `<table><tr><th>Öğrenci</th><th>Genel Ortalama</th><th>Sınav Sayısı</th></tr>`;
  for (const g of sonuc.genel_ortalamalar) {
    html += `<tr><td>${g.ad_soyad}</td><td>${g.genel_ortalama}</td><td>${g.sinav_sayisi}</td></tr>`;
  }
  html += `</table>`;
  alan.innerHTML = html;
}

dersleriYukle();
</script>
</body>
</html>
