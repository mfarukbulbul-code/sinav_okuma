<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sınav Kağıdını Gönder</title>
<link rel="stylesheet" href="stil.css">
</head>
<body>
<div class="kapsayici">
  <h1 id="sinavBasligi">Sınav yükleniyor...</h1>
  <p class="aciklama">Cevaplarını gönder, sonucun anında hesaplanacak.</p>

  <div class="kart" id="formKarti">
    <label for="adSoyad">Adın Soyadın</label>
    <input type="text" id="adSoyad" placeholder="Örn: Ahmet Yılmaz">

    <label for="ogrenciNo">Öğrenci numaran (varsa)</label>
    <input type="text" id="ogrenciNo" placeholder="Örn: 12">

    <label for="testCevaplari">Test sorularının cevapları varsa (örn: 1:A, 2:C, 3:B)</label>
    <textarea id="testCevaplari" rows="2" placeholder="1:A, 2:C, 3:B ..."></textarea>

    <label>Yazılı / el yazısı kağıdının fotoğrafı (arkalı önlü / çok sayfa: "Fotoğraf Ekle"ye tekrar tekrar bas)</label>
    <div id="kagitFotoAlani"></div>

    <button onclick="gonder()" id="gonderBtn">Cevaplarımı Gönder</button>
    <div id="gonderMesaj"></div>
  </div>

  <div class="kart" id="sonucKarti" style="display:none;">
    <h2>Sonucun</h2>
    <div class="puan-buyuk" id="toplamPuan"></div>
    <table id="soruTablosu"></table>
  </div>
</div>

<script src="ayarlar.js"></script>
<script>
const urlParametreleri = new URLSearchParams(window.location.search);
const linkKodu = urlParametreleri.get("kod");
const kagitToplayici = fotografToplayiciOlustur(document.getElementById("kagitFotoAlani"));

async function sinavBilgisiniYukle() {
  if (!linkKodu) {
    document.getElementById("sinavBasligi").textContent = "Geçersiz sınav linki.";
    document.getElementById("formKarti").style.display = "none";
    return;
  }
  const sonuc = await api("admin-api", { action: "sinav_bilgisi_getir", link_kodu: linkKodu });
  if (sonuc.basarili) {
    document.getElementById("sinavBasligi").textContent = sonuc.sinav_adi;
  } else {
    document.getElementById("sinavBasligi").textContent = "Sınav bulunamadı.";
    document.getElementById("formKarti").style.display = "none";
  }
}

async function gonder() {
  const adSoyad = document.getElementById("adSoyad").value.trim();
  const ogrenciNo = document.getElementById("ogrenciNo").value.trim();
  const testCevaplari = document.getElementById("testCevaplari").value.trim();
  const dosyalar = kagitToplayici.dosyalar;
  const btn = document.getElementById("gonderBtn");
  const mesajAlani = document.getElementById("gonderMesaj");

  if (!adSoyad) { mesajAlani.innerHTML = `<div class="mesaj hata">Adını gir.</div>`; return; }
  if (!testCevaplari && dosyalar.length === 0) {
    mesajAlani.innerHTML = `<div class="mesaj hata">Test cevaplarını yaz veya fotoğraf ekle.</div>`;
    return;
  }

  btn.disabled = true;
  mesajAlani.innerHTML = `<div class="mesaj basarili">Değerlendiriliyor, lütfen bekle...</div>`;

  try {
    const gorseller = dosyalar.length > 0 ? await birdenFazlaDosyayiBase64eCevir(dosyalar) : [];
    const sonuc = await api("sinav-degerlendir", {
      link_kodu: linkKodu,
      ogrenci_ad_soyad: adSoyad,
      ogrenci_no: ogrenciNo || null,
      test_cevaplari: testCevaplari || null,
      gorseller,
    });

    if (sonuc.basarili) {
      mesajAlani.innerHTML = "";
      document.getElementById("formKarti").style.display = "none";
      document.getElementById("sonucKarti").style.display = "block";
      document.getElementById("toplamPuan").textContent = sonuc.sonuc.puan;

      let tabloHtml = `<tr><th>Soru</th><th>Cevabın</th><th>Puan</th><th>Durum</th></tr>`;
      for (const s of sonuc.sonuc.soru_detaylari || []) {
        const durum = s.dogru_mu
          ? `<span class="dogru">Doğru</span>`
          : `<span class="yanlis">${s.aciklama ? s.aciklama : "Eksik/Yanlış"}</span>`;
        const puanGosterimi = (s.kazanilan_puan !== undefined && s.soru_puani !== undefined)
          ? `${s.kazanilan_puan} / ${s.soru_puani}`
          : "-";
        tabloHtml += `<tr><td>${s.soru_no}</td><td>${s.ogrenci_cevabi ?? "-"}</td><td>${puanGosterimi}</td><td>${durum}</td></tr>`;
      }
      document.getElementById("soruTablosu").innerHTML = tabloHtml;
    } else {
      mesajAlani.innerHTML = `<div class="mesaj hata">${sonuc.hata}</div>`;
    }
  } catch (e) {
    mesajAlani.innerHTML = `<div class="mesaj hata">Hata: ${e}</div>`;
  } finally {
    btn.disabled = false;
  }
}

sinavBilgisiniYukle();
</script>
</body>
</html>
